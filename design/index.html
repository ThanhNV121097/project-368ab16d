<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello Word</title>
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #111827;
    --accent: #2563EB;
    --muted: #6B7280;
    --surface: #F9FAFB;
    --error: #DC2626;
    --border: #E5E7EB;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: min(480px, 100%);
    text-align: center;
    padding: 56px 32px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
    box-shadow: 0 1px 2px rgba(17,24,39,.05);
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .greeting {
    font-size: 40px;
    font-weight: 700;
    line-height: 1.15;
    margin: 0;
    min-height: 46px;
    transition: opacity .18s ease;
  }
  .greeting[data-state="loading"] { opacity: .35; }
  .greeting[data-state="error"] { color: var(--error); }
  .greeting[data-state="empty"] { color: var(--muted); font-weight: 500; }
  .hint {
    margin-top: 20px;
    font-size: 14px;
    color: var(--muted);
  }
  .demo {
    margin-top: 32px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .demo button {
    font: inherit;
    font-size: 13px;
    color: var(--accent);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .demo button:hover { background: #EFF6FF; border-color: var(--accent); }
  .demo button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .demo button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  @media (max-width: 420px) {
    .greeting { font-size: 32px; }
    .card { padding: 40px 20px; }
  }
</style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="eyebrow">Greeting from database</div>
    <h1 class="greeting" id="greeting" data-state="loading">…</h1>
    <p class="hint" id="hint">Reading from PostgreSQL…</p>
  </main>

  <nav class="demo" aria-label="Preview states">
    <button type="button" data-state="loading">Loading</button>
    <button type="button" data-state="loaded" aria-pressed="true">Loaded</button>
    <button type="button" data-state="error">Error</button>
    <button type="button" data-state="empty">Empty</button>
  </nav>

<script>
  var STATES = {
    loading: { text: '…', hint: 'Reading from PostgreSQL…' },
    loaded:  { text: 'Hello Word', hint: 'Served by GET /api/greeting' },
    error:   { text: 'Could not load greeting', hint: 'The database did not respond.' },
    empty:   { text: 'No greeting set', hint: 'The table is empty.' }
  };

  var greeting = document.getElementById('greeting');
  var hint = document.getElementById('hint');
  var buttons = document.querySelectorAll('.demo button');

  function show(state) {
    greeting.textContent = STATES[state].text;
    greeting.setAttribute('data-state', state);
    hint.textContent = STATES[state].hint;
    buttons.forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-state') === state));
    });
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function () { show(b.getAttribute('data-state')); });
  });

  // Reach the loaded state automatically, like a real fetch completing.
  setTimeout(function () { show('loaded'); }, 800);
</script>
</body>
</html>
